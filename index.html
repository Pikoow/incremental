<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incremental</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1><span id="score">0</span></h1>
    <p><span id="production">0</span> / sec</p>
    <p>Multiplicateur : ×<span id="multiplicateur">1</span></p>
    <div class="buy-amount" aria-label="Nombre d'améliorations à acheter">
      <button type="button" data-buy-amount="1" aria-pressed="true">1</button>
      <button type="button" data-buy-amount="10" aria-pressed="false">10</button>
      <button type="button" data-buy-amount="100" aria-pressed="false">100</button>
      <button type="button" data-buy-amount="max" aria-pressed="false">Max</button>
    </div>
    <div class="upgrade">
      [<span id="compte_addition">0</span>]
      <span>Production +1/sec</span>
      <button id="achat_addition">ACHETER (10)</button>
    </div>
    <div class="upgrade">
      [<span id="compte_multiplicateur">0</span>]
      <span>Multiplicateur</span>
      <button id="achat_multiplicateur">ACHETER (10)</button>
    </div>
  </body>
</html>
